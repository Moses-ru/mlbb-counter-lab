<title>MLBB Counter Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: stats console. Sticky top bar, title band, "build vs hero" band, then hero grid + tier table side by side. */
:root{
  color-scheme: dark;
  --bg:#0b0f18; --surface:#121827; --surface-2:#182033; --surface-3:#20293f; --line:#27314a;
  --fg:#e8ecf6; --muted:#8c97b0; --dim:#5f6984;
  --gold:#e6b655; --gold-soft:rgba(230,182,85,.14); --gold-ink:#1d1504;
  --blue:#5e8eff; --blue-soft:rgba(94,142,255,.16);
  --win:#3fcf8e; --loss:#f0647a; --win-soft:rgba(63,207,142,.14); --loss-soft:rgba(240,100,122,.14);
  --t-s:#ff8a3d; --t-a:#e6b655; --t-b:#5e8eff; --t-c:#7e8aa5; --t-d:#565f78;
  --phys:#e0704f; --magic:#9b72f0; --def:#3fae9b; --boots:#7d8bab;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:56px}
.logo{font-family:var(--display);font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{color:var(--gold);font-weight:400}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--gold),#b9772e);display:grid;place-items:center;color:var(--gold-ink);font-size:14px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap}
.nav a:hover{color:var(--fg);background:var(--surface-2)}
.nav a.on{color:var(--fg);background:var(--surface-3)}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--win);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,207,142,.5)}70%{box-shadow:0 0 0 8px rgba(63,207,142,0)}100%{box-shadow:0 0 0 0 rgba(63,207,142,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}*{transition:none!important}}
@media (max-width:760px){.live .lbl{display:none}}

.band{border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface) 0%,var(--bg) 100%)}
.band .wrap{padding-block:26px 22px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.2vw,30px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;text-wrap:balance}
.lead{color:var(--muted);max-width:68ch;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.chip strong{color:var(--fg);font-weight:700}

.quick{margin-top:20px;display:grid;grid-template-columns:1fr auto 1fr auto;gap:12px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:14px;background:
  radial-gradient(120% 140% at 0% 0%,rgba(230,182,85,.10),transparent 55%),
  radial-gradient(120% 140% at 100% 100%,rgba(240,100,122,.10),transparent 55%),var(--surface)}
.quick .q-title{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.quick .q-title span{color:var(--muted);font-size:13px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:left;min-width:0;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--dim);background:var(--surface-3)}
.pick .who{min-width:0}
.pick small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.pick .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pick.me{box-shadow:inset 3px 0 0 var(--gold)}
.pick.en{box-shadow:inset 3px 0 0 var(--loss)}
.vs{font-family:var(--display);color:var(--dim);font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;background:var(--gold);color:var(--gold-ink);font-weight:800;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:13px}
@media (max-width:760px){
  .quick{grid-template-columns:1fr auto 1fr}
  .quick .btn{grid-column:1/-1}
  .pick{flex-direction:column;align-items:flex-start;gap:8px}
}

.av{--s:40px;width:var(--s);height:var(--s);flex:none;border-radius:calc(var(--s)*.26);display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--c1),var(--c2));font-family:var(--display);color:rgba(255,255,255,.92);font-size:calc(var(--s)*.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.av img{width:100%;height:100%;object-fit:cover;display:block}

main .wrap{padding-block:22px 48px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:7px 14px;border-radius:7px;color:var(--muted);font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--blue);color:#fff}
.seg.gold button.on{background:var(--gold);color:var(--gold-ink)}
.seg svg{width:15px;height:15px}

.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}.cols .side{order:2}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h .hint{color:var(--muted);font-size:13px}
.panel-b{padding:14px 16px}
.side .panel-b{position:sticky;top:calc(56px + env(safe-area-inset-top,0px))}
.side .hgrid{max-height:62vh;overflow:auto;padding:4px 2px 2px;margin:0 -2px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;padding:10px 0;outline:none}
.search svg{width:16px;height:16px;color:var(--dim);flex:none}
.cls{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.cls button{padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700}
.cls button.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px 8px}
.hcell{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.hcell .av{--s:52px;transition:transform .15s}
.hcell:hover .av{transform:translateY(-2px)}
.hcell span.n{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:660px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--muted)}
th.on{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.hname{display:flex;align-items:center;gap:10px;font-weight:800}
.hname .av{--s:36px}
.hname small{display:block;color:var(--dim);font-weight:600;font-size:11px}
.tier{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font-family:var(--display);font-size:14px;color:#fff}
.tier.S{background:var(--t-s)}.tier.A{background:var(--t-a);color:var(--gold-ink)}.tier.B{background:var(--t-b)}.tier.C{background:var(--t-c)}.tier.D{background:var(--t-d)}
.role{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.role svg{width:16px;height:16px}
.wr-hi{color:var(--win)}.wr-lo{color:var(--loss)}
.minis{display:flex;gap:4px}
.minis a .av{--s:28px;border-radius:50%}
.minis a:hover .av{outline:2px solid var(--loss);outline-offset:1px}
.more{padding:12px 16px;border-top:1px solid var(--line);text-align:center}
.more button{color:var(--blue);font-weight:700}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;margin-bottom:12px}
.back:hover{color:var(--fg)}
.hhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hhead > .av{--s:92px}
.hhead .info{flex:1;min-width:220px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tag.phys{color:var(--phys)}.tag.magic{color:var(--magic)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:min(100%,360px)}
.kpi{background:var(--surface);padding:10px 14px}
.kpi small{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.kpi b{font-family:var(--mono);font-size:18px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

.build{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:620px){.build{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;min-width:0}
.ico{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:#fff;position:relative;flex:none;
  background:linear-gradient(150deg,var(--ic),color-mix(in srgb,var(--ic) 45%,#000));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ico img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ico.phys{--ic:var(--phys)}.ico.magic{--ic:var(--magic)}.ico.def{--ic:var(--def)}.ico.boots{--ic:var(--boots)}
.ico .ord{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-family:var(--mono);font-size:11px;display:grid;place-items:center;color:var(--muted);z-index:1}
.item .iname{font-size:11.5px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.item .kind{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.item.counter .ico{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(230,182,85,.35)}
.item.counter .kind{color:var(--gold)}
.item.core .kind{color:var(--win)}
.item.filler .ico{opacity:.85;outline:1px dashed var(--dim);outline-offset:3px}
.tip-pop{position:fixed;z-index:50;max-width:260px;padding:10px 12px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line);font-size:12px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tip-pop b{display:block;margin-bottom:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}

.brow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brow:last-child{border-bottom:0}
.brow .icos{display:flex;gap:6px;flex-wrap:wrap}
.brow .ico{width:42px;height:42px;border-radius:9px;font-size:11px}
.brow .bst{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted)}
.brow .bst b{font-family:var(--mono);color:var(--fg);font-weight:600}

.loadout{display:flex;flex-direction:column;gap:12px}
.lo{display:flex;align-items:center;gap:12px}
.lo .ico{width:40px;height:40px;border-radius:10px;font-size:11px}
.lo .ico.round{border-radius:50%}
.lo small{display:block;color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.lo b{font-weight:800}
.lo .sub{color:var(--muted);font-size:12px}
.talents{display:flex;gap:8px;flex-wrap:wrap}
.talent{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:10px;background:var(--surface-2);font-size:12.5px;font-weight:700}
.talent .ico{width:28px;height:28px;border-radius:50%;font-size:9px}

.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid transparent}
.mrow:hover{border-color:var(--line)}
.mrow .av{--s:34px}
.mrow .grow{flex:1;min-width:0;font-weight:700}
.mrow .grow small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:800;margin:0 0 10px}

.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.side-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.side-card.en{flex-direction:row-reverse;text-align:right}
.side-card .av{--s:68px}
.side-card small{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.side-card .nm{font-family:var(--display);font-size:22px;line-height:1.1}
.side-card .sub{color:var(--muted);font-size:12px}
.side-card .swap{margin-top:6px;font-size:12px;color:var(--blue);font-weight:700}
.vsdot{display:flex;flex-direction:column;align-items:center;gap:8px}
.vsdot .v{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-family:var(--display);color:var(--muted)}
.wrbar{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.wrbar .lbls{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.bar{height:10px;border-radius:999px;background:var(--loss);overflow:hidden}
.bar i{display:block;height:100%;background:var(--win);border-radius:999px 0 0 999px}
.wrbar p{margin:8px 0 0;color:var(--muted);font-size:12.5px}
.changes{display:flex;flex-direction:column;gap:10px}
.chg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px;border-radius:12px;background:var(--surface-2);align-items:start}
.chg .ico{width:40px;height:40px;font-size:12px;border-radius:9px}
.chg b{display:block}
.chg p{margin:2px 0 0;color:var(--muted);font-size:13px}
.chg .lab{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
.lab.add{background:var(--gold-soft);color:var(--gold)}.lab.keep{background:var(--win-soft);color:var(--win)}.lab.spell{background:var(--blue-soft);color:var(--blue)}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tips li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13.5px}
.tips li::before{content:"";width:8px;height:8px;margin:7px 0 0 7px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.tips li.pair::before{background:var(--loss)}
.enemies{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.enemies button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);padding:6px 2px;border-radius:10px;border:1px solid transparent;min-width:0}
.enemies button span.n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.enemies button .av{--s:44px}
.enemies button:hover{background:var(--surface-2)}
.enemies button.on{border-color:var(--loss);background:var(--loss-soft);color:var(--fg)}
.enemies .wr{font-family:var(--mono);font-size:10px}

.modal{position:fixed;inset:0;z-index:40;background:rgba(5,8,14,.72);display:grid;place-items:center;padding:16px}
.sheet{width:min(620px,100%);max-height:min(680px,90vh);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sheet .panel-b{overflow:auto}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--surface-2);color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--surface-3);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.foot{border-top:1px solid var(--line);color:var(--dim);font-size:12px}
.foot .wrap{padding-block:18px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
.foot a{color:var(--muted);text-decoration:underline}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
/* item card (tooltip + tap sheet) */
.tip-pop{max-width:300px;width:300px}
.ic-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ic-head .ico{width:40px;height:40px;border-radius:9px;font-size:11px}
.ic-head b{display:block;font-size:14px}
.ic-head small{display:block;color:var(--dim);font-size:11px}
.ic-stats{margin:0 0 8px;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;color:var(--win);font-family:var(--mono);font-size:12px}
.ic-p{margin:0 0 6px;color:var(--muted);font-size:12.5px;line-height:1.45}
.ic-p b{color:var(--gold)}
.item-sheet{width:min(440px,100%)}
.item-sheet .ic-head .ico{width:56px;height:56px}
.item-sheet .ic-p{font-size:13.5px}
[data-item]{cursor:pointer}
/* player profile */
.login{max-width:560px}
.lform{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.frow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}

<script>
(() => {
const POLL_MS = 5 * 60 * 1000;
const CLASS = { marksman:'Стрелок', tank:'Танк', fighter:'Боец', assassin:'Убийца', mage:'Маг', support:'Поддержка' };
const LANE  = { exp:'Опыт', jungle:'Лес', mid:'Мид', gold:'Золото', roam:'Роум' };
const LANE_ORDER = ['exp','jungle','mid','gold','roam'];
const ICON = {
  exp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19 19 5M14 5h5v5M5 14l5 5"/></svg>',
  jungle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11M12 11c0-4 3-7 7-8-1 4-3 7-7 8ZM12 14c0-3-2-6-6-7 0 4 2 6 6 7Z"/></svg>',
  mid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6 .7-4.4 4.1 1.2 6L12 16.5 6.6 19.4l1.2-6L3.4 9.3l6-.7L12 3Z"/></svg>',
  gold:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h5"/></svg>',
  roam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6l-8-3Z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
};

const store = {
  get(k, d){ try{ const v = localStorage.getItem('mcl:'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mcl:'+k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  data:null, img:{}, tierCache:{},
  rank: store.get('rank2','mythic'),
  lane:'all', cls:'all', q:'', rows:40,
  sort:{ key:'tier', dir:1 },
  me: store.get('me','ixia'), en: store.get('en','melissa')
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let HM = {};
const H = id => HM[id];
const I = id => S.data.items[id] || { name:'Предмет ' + id, cat:'def', desc:'' };
const CI = name => S.data.counterItems[name];
const st = h => h.stats[S.rank] || h.stats.all || [50, 0, 0];
const pct = v => (+v).toFixed(1) + '%';
const pct2 = v => (+v).toFixed(2) + '%';
const rankName = () => S.data.ranks.find(r => r.id === S.rank)?.name || '';

function avatar(h, size){
  const src = S.img['h:' + h.id];
  const hue = (h.hid * 47) % 360;
  return `<span class="av" style="--c1:hsl(${hue} 55% 46%);--c2:hsl(${(hue + 60) % 360} 50% 26%)${size ? ';--s:' + size + 'px' : ''}" aria-hidden="true">${src ? `<img src="${src}" alt="" loading="lazy">` : `<span>${esc(h.en.slice(0,2))}</span>`}</span>`;
}
function laneIco(k){ const src = S.img['l:' + k]; return src ? `<img class="lane-ico" src="${src}" alt="">` : (ICON[k] || ''); }
function classIco(k){ const src = S.img['c:' + k]; return src ? `<img class="lane-ico" src="${src}" alt="">` : ''; }
function trendChart(tr){
  if (!tr || tr.length < 3) return '<div class="empty">Нет данных</div>';
  const W = 640, Hh = 170, pl = 44, pr = 16, pt = 14, pb = 26;
  const v = tr.map(t => t[1]);
  let lo = Math.min(...v, 50), hi = Math.max(...v, 50);
  const pad = Math.max(0.4, (hi - lo) * 0.15); lo = Math.floor((lo - pad) * 2) / 2; hi = Math.ceil((hi + pad) * 2) / 2;
  const x = i => pl + (W - pl - pr) * i / (tr.length - 1), y = val => pt + (Hh - pt - pb) * (hi - val) / (hi - lo);
  const line = tr.map((t, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(t[1]).toFixed(1)}`).join('');
  const area = line + `L${x(tr.length - 1).toFixed(1)},${(Hh - pb)}L${pl},${Hh - pb}Z`;
  const ticks = [lo, (lo + hi) / 2, hi];
  const last = tr[tr.length - 1], first = tr[0];
  const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
  const diff = last[1] - first[1];
  return `<div class="trend-head"><span>Винрейт сейчас <b class="num ${last[1] >= 50 ? 'wr-hi' : 'wr-lo'}">${pct(last[1])}</b></span><span>За 30 дней <b class="num ${diff >= 0 ? 'wr-hi' : 'wr-lo'}">${diff >= 0 ? '+' : ''}${diff.toFixed(1)}</b></span><span>Пикрейт <b class="num">${pct2(last[2])}</b></span><span>Банрейт <b class="num">${pct(last[3])}</b></span></div>
  <div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Винрейт за 30 дней">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" fill="var(--dim)" font-size="11" font-family="JetBrains Mono, monospace">${t.toFixed(1)}%</text>`).join('')}
    ${50 > lo && 50 < hi ? `<line x1="${pl}" x2="${W - pr}" y1="${y(50)}" y2="${y(50)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>` : ''}
    <path d="${area}" fill="var(--gold)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(tr.length - 1)}" cy="${y(last[1])}" r="4.5" fill="var(--gold)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl}" y="${Hh - 6}" fill="var(--dim)" font-size="11">${fmt(first[0])}</text>
    <text x="${W - pr}" y="${Hh - 6}" text-anchor="end" fill="var(--dim)" font-size="11">${fmt(last[0])}</text>
  </svg></div>`;
}
function skillIco(id, name){ const src = S.img['k:' + id]; return `<span class="ico def round" title="${esc(name)}">${src ? `<img src="${src}" alt="">` : abbr(name)}</span>`; }
function abbr(name){
  const w = String(name).replace(/[^A-Za-z ]/g,'').split(' ').filter(x => x && !['of','the'].includes(x.toLowerCase()));
  return w.length ? (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0,2)).toUpperCase() : '?';
}
function itemIco(id, ord){
  const it = I(id), src = S.img['i:' + id];
  return `<span class="ico ${it.cat}" data-item="${id}">${ord ? `<span class="ord">${ord}</span>` : ''}${src ? `<img src="${src}" alt="${esc(it.name)}" loading="lazy">` : abbr(it.name)}</span>`;
}
function iconOf(key, name, round){
  const src = S.img[key];
  return `<span class="ico def${round ? ' round' : ''}" title="${esc(name)}">${src ? `<img src="${src}" alt="">` : abbr(name)}</span>`;
}

/* ---------- tiers (percentile inside the selected rank) ---------- */
function score(h){ const [wr, pr, br] = st(h); return (wr - 50) + Math.log10(pr * 100 + 1) * 1.5 + br * 0.04; }
function tierOf(h){
  if (!S.tierCache[S.rank]){
    const arr = S.data.heroes.map(x => ({ id:x.id, s:score(x) })).sort((a, b) => b.s - a.s);
    const m = {}; arr.forEach((x, i) => { const p = i / arr.length; m[x.id] = p < .08 ? 'S' : p < .25 ? 'A' : p < .6 ? 'B' : p < .85 ? 'C' : 'D'; });
    S.tierCache[S.rank] = m;
  }
  return S.tierCache[S.rank][h.id];
}
const TIER_RANK = { S:0, A:1, B:2, C:3, D:4 };

/* ---------- hero profile from official skill tags ---------- */
function prof(h){
  const t = h.tags || {}, g = k => t[k] || 0;
  return {
    heal: g('Лечение') + (h.class === 'support' && g('Лечение') ? 1 : 0),
    shield: g('Щит'),
    cc: g('Контроль') + Math.floor(g('Замедл.') / 2),
    mobility: g('Перемещ.') + g('Рывок') + g('Телепорт'),
    burst: g('Разруш.') + (h.class === 'assassin' ? 2 : h.class === 'mage' ? 1 : 0),
    dps: h.class === 'marksman' ? 3 : h.class === 'fighter' ? 1 : 0,
    tank: h.class === 'tank' ? 3 : h.class === 'fighter' ? 1 : 0
  };
}

/* ---------- matchup engine ---------- */
function family(me, en){
  const tank = me.class === 'tank', sup = me.class === 'support', magic = me.dmg === 'magic';
  const carryPhys = !magic && (me.class === 'marksman' || me.class === 'assassin');
  return {
    antiHeal: tank ? 'Dominance Ice' : magic ? 'Glowing Wand' : 'Sea Halberd',
    vsPhys: (tank || sup) ? (en.class === 'marksman' ? 'Blade Armor' : 'Antique Cuirass')
          : me.class === 'marksman' ? 'Wind of Nature'
          : me.class === 'mage' ? 'Winter Crown'
          : me.class === 'assassin' ? 'Immortality'
          : (en.class === 'marksman' ? 'Blade Armor' : 'Antique Cuirass'),
    vsMagic: carryPhys ? 'Rose Gold Meteor' : me.class === 'mage' ? 'Winter Crown' : "Athena's Shield",
    vsTank: (tank || sup) ? null : magic ? 'Divine Glaive' : 'Malefic Roar'
  };
}
const WHY = {
  'Wind of Nature':'по активации 2 секунды иммунитета к физическому урону',
  'Winter Crown':'по активации замораживает тебя и даёт неуязвимость на 2 секунды',
  'Immortality':'после смерти воскрешает на месте',
  'Blade Armor':'возвращает урон тем, кто бьёт тебя атаками, особенно критами',
  'Antique Cuirass':'снижает физическую атаку врагов, которые тебя бьют',
  'Rose Gold Meteor':'даёт щит от магического урона при низком здоровье',
  "Athena's Shield":'даёт щит от магического урона и снижает входящую магию'
};
function threats(me, en){
  const t = prof(en), F = family(me, en), out = [], E = en.name;
  const add = (key, name, why) => { const id = CI(name); if (id) out.push({ key, id, why }); };
  const N = name => I(CI(name)).name;
  if (t.heal >= 2) add('heal', F.antiHeal, `${E} много лечится. ${N(F.antiHeal)} режет лечение, бери его рано.`);
  if (en.dmg === 'phys' && (t.burst >= 2 || t.dps >= 3)) add('phys', F.vsPhys, `${E} наносит много физического урона. ${N(F.vsPhys)}: ${WHY[F.vsPhys] || 'защита от физ. урона'}.`);
  if (en.dmg === 'magic' && t.burst >= 2) add('magic', F.vsMagic, `${E} бьёт магическим комбо. ${N(F.vsMagic)}: ${WHY[F.vsMagic] || 'защита от магии'}.`);
  if (en.class === 'tank' && F.vsTank) add('tank', F.vsTank, `${E} очень плотный. ${N(F.vsTank)} пробивает защиту.`);
  return { list: out, cc: t.cc >= 2, p: t };
}
function defaultBoots(me, en, cc){
  if (cc) return 'Tough Boots';
  if (me.class === 'marksman') return 'Swift Boots';
  if (me.class === 'mage') return 'Arcane Boots';
  if (me.class === 'tank' || me.class === 'support') return en.dmg === 'phys' ? 'Warrior Boots' : 'Tough Boots';
  return en.dmg === 'phys' ? 'Warrior Boots' : 'Tough Boots';
}
function fillers(me){
  if (me.class === 'tank' || me.class === 'support') return ["Athena's Shield", 'Antique Cuirass', 'Guardian Helmet', 'Immortality'];
  if (me.dmg === 'magic') return ['Holy Crystal', 'Divine Glaive', 'Immortality', 'Winter Crown'];
  if (me.class === 'marksman') return ['Malefic Roar', 'Blade of Despair', 'Wind of Nature', 'Immortality'];
  return ['Malefic Roar', 'Hunter Strike', 'Immortality', 'Brute Force Breastplate'];
}
function buildVs(me, en){
  const core = (me.builds[0]?.items || []).slice();
  const th = threats(me, en);
  const notes = [], counters = [];
  for (const r of th.list){
    if (core.includes(r.id) || counters.includes(r.id)){ notes.push({ type:'keep', id:r.id, why:r.why }); continue; }
    if (counters.length >= 2) continue;
    counters.push(r.id); notes.push({ type:'add', id:r.id, why:r.why });
  }
  const bootsName = defaultBoots(me, en, th.cc);
  const boots = CI(bootsName);
  if (th.cc) notes.push({ type:'add', id:boots, why:`У ${en.name} много контроля. Tough Boots сокращают его длительность.` });
  const order = [boots, core[0], ...counters, ...core.slice(1)].filter(Boolean);
  const kind = {}; order.forEach(id => kind[id] = id === boots ? 'boots' : counters.includes(id) ? 'counter' : 'core');
  for (const n of fillers(me)){ if (order.length >= 6) break; const id = CI(n); if (id && !order.includes(id)){ order.push(id); kind[id] = 'filler'; } }
  const sp = me.builds[0]?.spell;
  let spell = sp, spellWhy = '';
  if (th.cc && me.lane !== 'jungle' && me.class !== 'tank' && th.p.cc >= 3){ spell = 'purify'; spellWhy = `Purify снимает контроль ${en.name} в момент захода.`; }
  return { order:order.slice(0, 6), kind, notes, spell, spellWhy, coreBuild: me.builds[0] };
}
function matchup(me, en){
  const f = (arr, id) => (arr || []).find(x => x.id === id);
  let x;
  if ((x = f(me.weakTo, en.id))) return { wr:100 - x.wr, real:true };
  if ((x = f(me.strongVs, en.id))) return { wr:100 - x.wr, real:true };
  if ((x = f(en.weakTo, me.id))) return { wr:x.wr, real:true };
  if ((x = f(en.strongVs, me.id))) return { wr:x.wr, real:true };
  return { wr:Math.max(40, Math.min(60, 50 + (st(me)[0] - st(en)[0]) / 2)), real:false };
}
function tipsFor(me, en){
  const out = [], p = prof(en), E = en.name;
  if (me.rel.weak.includes(en.id)) out.push({ t:`По данным Moonton, ${E} входит в контрпики героя ${me.name}. Играй аккуратнее обычного и не дерись один на один.`, pair:true });
  if (me.rel.strong.includes(en.id)) out.push({ t:`По данным Moonton, ${me.name} силён против ${E}. Навязывай драки.`, pair:true });
  if (me.range === 'ranged' && en.range === 'melee') out.push({ t:`${E} дерётся вблизи. Держи дистанцию и бей на отходе.` });
  if (me.range === 'melee' && en.range === 'ranged') out.push({ t:`${E} бьёт с дистанции. Подходи из кустов или после контроля союзника.` });
  if (p.mobility >= 2) out.push({ t:`У героя ${E} много перемещений. Ключевой контроль используй после того, как цель потратит рывки.` });
  if (p.burst >= 3) out.push({ t:`${E} убивает за одно комбо. Следи за миникартой и не отходи от команды.` });
  if (p.heal >= 2) out.push({ t:`Без антихила затяжную драку против ${E} не выиграть.` });
  if (p.cc >= 3) out.push({ t:`У героя ${E} сильный контроль. Не стой кучей с союзниками.` });
  if (en.class === 'tank') out.push({ t:`Не трать весь урон на танка. Бей тех, кто стоит за ним.` });
  return out.slice(0, 5);
}

const API = 'https://arena.rone.dev/api';
const auth = {
  get(){ return store.get('auth', null); },
  set(v){ store.set('auth', v); },
  clear(){ try{ localStorage.removeItem('mcl:auth'); }catch(e){} }
};
const P = { load:0, sid:null, matches:[], cursor:'', hasNext:false, res:{} };
const HID = id => S.data.heroes.find(h => h.hid === id);
async function api(path, { method = 'GET', body, token } = {}){
  let r;
  try {
    r = await fetch(API + path, { method, headers: { 'Content-Type':'application/json', ...(token ? { Authorization:'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  } catch(e){ const err = new Error('network'); err.network = true; throw err; }
  let j = null; try { j = await r.json(); } catch(e){}
  if (r.status === 401 || r.status === 403){ const err = new Error((j && (j.message || j.msg)) || 'Сессия истекла'); err.auth = true; throw err; }
  if (!r.ok || !j || j.status === 'error' || (typeof j.code === 'number' && j.code !== 0)){
    const err = new Error((j && (j.msg || j.message || (typeof j.details === 'string' ? j.details : ''))) || ('Ошибка ' + r.status));
    err.code = j && j.code;
    throw err;
  }
  return j.data;
}
function rankOf(level){
  const t = S.data.rankTable || [];
  const row = t.find(r => level >= r.start && level <= r.end) || (level > 0 ? t[t.length - 1] : null);
  if (!row) return null;
  const stars = row.big === 7 ? level - 135 : level - row.start + 1;
  return { name: row.name + (row.sub ? ' ' + row.sub : ''), stars, key: row.key, mythic: row.big === 7 };
}
function rankBadge(level, label){
  const r = rankOf(level); if (!r) return '';
  const src = S.img[r.key];
  return `<div class="rank">${src ? `<img src="${src}" alt="">` : ''}<div><small>${esc(label)}</small><b>${esc(r.name)}</b><span class="num">${r.stars} ★</span></div></div>`;
}
function heroAv(hid, ent, size){
  const h = HID(hid);
  if (h) return avatar(h, size);
  return `<span class="av" style="--c1:#334;--c2:#223${size ? ';--s:' + size + 'px' : ''}">${ent && ent.ix ? `<img src="${esc(ent.ix)}" alt="" loading="lazy">` : '?'}</span>`;
}
const heroName = (hid, ent) => HID(hid)?.name || ent?.n || ('Герой ' + hid);
const kdaRatio = (k, d, a) => ((k + a) / Math.max(1, d)).toFixed(2);
const rating = s => s == null ? '—' : (s / 100).toFixed(1);
function timeAgo(ts){
  const m = Math.round((Date.now() / 1000 - ts) / 60);
  if (m < 60) return Math.max(1, m) + ' мин назад';
  const h = Math.round(m / 60); if (h < 24) return h + ' ч назад';
  const d = Math.round(h / 24); if (d < 30) return d + ' дн назад';
  return new Date(ts * 1000).toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' });
}

async function loadMatches(my){

  const more = $('#m-more');

  const my = ++P.load;
  let d;
  try { d = await api(`/user/matches/${encodeURIComponent(bid)}?sid=${encodeURIComponent(sid)}&lang=ru`, { token:a.jwt }); }
  catch(err){
    if (my !== P.load) return;
    if (onAuthError(err)) return;
    head.innerHTML = `<h1>Матч</h1>${err.network ? offlineNote() : `<p class="lead">Не удалось загрузить матч: ${esc(err.message)}</p>`}`;
    return;
  }
  if (my !== P.load) return;
  const ps = (d && d.result) || [];
  if (!ps.length){ head.innerHTML = '<h1>Матч</h1><p class="lead">Нет данных об этом матче.</p>'; return; }
  try { Object.assign(P.res, JSON.parse(sessionStorage.getItem('mcl:res') || '{}')); } catch(e){}
  const me = ps.find(p => String(p.rid) === String(a.roleId)) || ps[0];
  const res = P.res[bid];
  const mine = ps.filter(p => p.f === me.f), them = ps.filter(p => p.f !== me.f);
  const meHero = HID(me.hid);
  const dur = Math.max(...ps.map(p => p.bd || 0));
  const kills = t => t.reduce((s, p) => s + (p.k || 0), 0);
  head.innerHTML = `
    <h1>${res === 1 ? '<em style="color:var(--win)">Победа</em>' : res != null ? '<em style="color:var(--loss)">Поражение</em>' : 'Матч'} · ${esc(heroName(me.hid, me.hid_e))}</h1>
    <div class="meta">
      ${me.ts ? `<span class="chip">${new Date(me.ts * 1000).toLocaleString('ru-RU', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' })}</span>` : ''}
      ${dur ? `<span class="chip">Длительность: <strong class="num">${Math.floor(dur / 60)}:${String(dur % 60).padStart(2, '0')}</strong></span>` : ''}
      <span class="chip">Счёт: <strong class="num">${kills(mine)} : ${kills(them)}</strong></span>
    </div>`;
  const maxO = Math.max(1, ...ps.map(p => p.o || 0));
  const team = (list, title, cls) => `
    <section class="panel team ${cls}"><div class="panel-h"><h2>${title}</h2><span class="hint num">${kills(list)} убийств</span></div>
      <div class="panel-b"><div class="players">${list.sort((x, y) => (y.s || 0) - (x.s || 0)).map(p => {
        const h = HID(p.hid), isMe = p === me;
        const items = (p.its || []).filter(Boolean);
        return `<div class="player ${isMe ? 'me' : ''}">
          <div class="pl-top">
            ${h ? `<a href="#hero-${h.id}">${heroAv(p.hid, p.hid_e, 40)}</a>` : heroAv(p.hid, p.hid_e, 40)}
            <span class="pl-name"><b>${esc(p.rname || 'Игрок')}</b><small>${esc(heroName(p.hid, p.hid_e))}${p.hlvl ? ' · ур. ' + p.hlvl : ''}</small></span>
            ${p.mvp ? '<span class="mvp">MVP</span>' : ''}
            <span class="kda"><b class="num">${p.k} / <span class="wr-lo">${p.d}</span> / ${p.a}</b><small class="num">${kdaRatio(p.k, p.d, p.a)} KDA</small></span>
            <span class="score"><small>Оценка</small><b class="num">${rating(p.s)}</b></span>
          </div>
          <div class="pl-bot">
            <span class="icos">${items.map(id => S.data.items[id] ? itemIco(id) : `<span class="ico def">${id}</span>`).join('') || '<span class="empty">нет предметов</span>'}</span>
            <span class="dmg" title="Урон по героям">${p.o != null ? `<i style="width:${(p.o / maxO * 100).toFixed(0)}%"></i><b class="num">${Number(p.o).toLocaleString('ru-RU')}</b>` : ''}${p.tfr != null ? `<small class="num">участие ${Math.round(p.tfr * 100)}%</small>` : ''}</span>
            ${!isMe && cls === 'them' && meHero && h && h.id !== meHero.id ? `<a class="vslink" href="#vs-${meHero.id}-${h.id}">Билд против →</a>` : ''}
          </div>
        </div>`;
      }).join('')}</div></div></section>`;
  body.innerHTML = `<div class="stack">${team(mine, 'Моя команда', 'mine')}${team(them, 'Соперники', 'them')}</div>`;
}

/* ---------- picker ---------- */
function openPicker(which, fromHero){
  if (fromHero) S.me = fromHero;
  const other = which === 'me' ? S.en : S.me;
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${which === 'me' ? 'На ком ты играешь' : 'Кто против тебя'}">
    <div class="panel-h"><h2>${which === 'me' ? 'На ком ты играешь?' : 'Кто против тебя?'}</h2><button class="x" data-close aria-label="Закрыть">✕</button></div>
    <div class="panel-b">
      <label class="search">${ICON.search}<input id="pq" type="search" placeholder="Найти героя" autocomplete="off"></label>
      <div class="enemies" id="plist" style="margin-top:12px"></div>
    </div></div>`;
  document.body.appendChild(wrap);
  const draw = q => {
    $('#plist').innerHTML = S.data.heroes.filter(h => h.id !== other).filter(h => match(h, q)).sort((a, b) => a.name.localeCompare(b.name, 'ru'))
      .map(h => `<button data-choose="${h.id}" class="${h.id === S[which] ? 'on' : ''}">${avatar(h)}<span class="n">${esc(h.name)}</span></button>`).join('') || '<div class="empty">Ничего не найдено</div>';
  };
  draw('');
  const input = $('#pq'); setTimeout(() => input.focus(), 30);
  input.addEventListener('input', e => draw(e.target.value));
  const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('click', e => {
    if (e.target === wrap || e.target.closest('[data-close]')) return close();
    const c = e.target.closest('[data-choose]'); if (!c) return;
    S[which] = c.dataset.choose; store.set(which, S[which]);
    close();
    const r = route();
    if (r.name === 'vs' || fromHero) location.hash = `#vs-${S.me}-${S.en}`; else render(true);
  });
}

/* ---------- routing & render ---------- */
function route(){
  const h = (location.hash || '#tier').slice(1);
  let m;
  if ((m = h.match(/^vs-([a-z0-9]+)-([a-z0-9]+)$/))) return { name:'vs', me:m[1], en:m[2] };
  if (h === 'vs') return { name:'vs', me:S.me, en:S.en };
  if ((m = h.match(/^hero-([a-z0-9]+)$/))) return { name:'hero', id:m[1] };
  if (h === 'heroes') return { name:'heroes' };
  if (h === 'me') return { name:'me' };
  if ((m = h.match(/^match-([0-9]+)-([0-9]+)$/))) return { name:'match', bid:m[1], sid:m[2] };
  return { name:'tier' };
}
function render(keepScroll){
  if (!S.data) return;
  const r = route(), y = window.scrollY;
  $('#app').innerHTML = r.name === 'vs' ? viewVs(r.me, r.en) : r.name === 'hero' ? viewHero(r.id) : r.name === 'heroes' ? viewHeroes()
    : r.name === 'me' ? viewMe() : r.name === 'match' ? viewMatch(r.bid, r.sid) : viewTier();
  document.querySelectorAll('#nav a, #tabbar a').forEach(a => a.classList.toggle('on', a.dataset.r === r.name || (r.name === 'hero' && a.dataset.r === 'heroes') || (r.name === 'match' && a.dataset.r === 'me')));
  if (r.name === 'me' && auth.get()) loadMe();
  if (r.name === 'match') loadMatch(r.bid, r.sid);
  if (keepScroll) window.scrollTo(0, y);
}
function rerenderGrid(){
  const g = document.getElementById('hgrid'); if (!g) return;
  g.innerHTML = gridCells();
  document.querySelectorAll('[data-cls]').forEach(b => b.classList.toggle('on', b.dataset.cls === S.cls));
}
document.addEventListener('click', e => {
  const t = e.target;
  const go = t.closest('[data-go]');
  if (go && !t.closest('a')){ location.hash = go.dataset.go; return; }
  const p = t.closest('[data-pick]'); if (p){ openPicker(p.dataset.pick, p.dataset.from); return; }
  if (t.closest('[data-flip]')){ location.hash = `#vs-${S.en}-${S.me}`; return; }
  if (t.closest('[data-more]')){ S.rows = 1e9; render(true); return; }
  if (t.closest('[data-logout]')){ logout(); return; }
  if (t.closest('[data-reload]')){ loadMe(); return; }
  const sd = t.closest('[data-sid]'); if (sd){ P.sid = Number(sd.dataset.sid); document.querySelectorAll('[data-sid]').forEach(b => b.classList.toggle('on', b === sd)); const l = $('#m-list'); if (l) l.innerHTML = '<div class="empty">Загружаем матчи…</div>'; loadSeason(++P.load); return; }
  const mm = t.closest('[data-moremat]'); if (mm){ mm.disabled = true; mm.textContent = 'Загружаем…'; loadMatches(P.load); return; }
  const ln = t.closest('[data-lane]'); if (ln){ S.lane = ln.dataset.lane; render(true); return; }
  const bln = t.closest('[data-blane]'); if (bln){ S.blane = bln.dataset.blane; render(true); return; }
  const rk = t.closest('[data-rank]'); if (rk){ S.rank = rk.dataset.rank; store.set('rank2', S.rank); render(true); return; }
  const cl = t.closest('[data-cls]'); if (cl){ S.cls = cl.dataset.cls; rerenderGrid(); return; }
  const so = t.closest('[data-sort]');
  if (so){ const k = so.dataset.sort; S.sort = { key:k, dir:S.sort.key === k ? -S.sort.dir : 1 }; render(true); }
});
document.addEventListener('input', e => { if (e.target.id === 'hq'){ S.q = e.target.value; rerenderGrid(); } });
window.addEventListener('hashchange', () => { S.blane = null; render(); window.scrollTo(0, 0); });

const pop = document.createElement('div'); pop.className = 'tip-pop'; pop.hidden = true; document.body.appendChild(pop);
document.addEventListener('pointerover', e => {
  const el = e.target.closest('[data-item]');
  if (!el){ pop.hidden = true; return; }
  const it = I(el.dataset.item);
  if (e.pointerType === 'touch') return;
  pop.innerHTML = itemCard(el.dataset.item, true);
  pop.hidden = false;
  const r = el.getBoundingClientRect();
  pop.style.left = Math.min(window.innerWidth - 316, Math.max(8, r.left + r.width / 2 - 150)) + 'px';
  const below = r.bottom + 8, h = pop.offsetHeight;
  pop.style.top = (below + h > window.innerHeight - 8 && r.top - h - 8 > 8 ? r.top - h - 8 : below) + 'px';
});
window.addEventListener('scroll', () => { pop.hidden = true; }, { passive:true });
const CAT_RU = { phys:'Атака', magic:'Магия', def:'Защита', boots:'Ботинки' };
function itemCard(id, short){
  const it = I(id);
  const pas = it.passives || [];
  return `<div class="ic-head">${itemIco(id)}<div><b>${esc(it.name)}</b><small>${esc(CAT_RU[it.cat] || '')}${it.en && it.en !== it.name ? ' · ' + esc(it.en) : ''}</small></div></div>
    ${(it.stats || []).length ? `<ul class="ic-stats">${it.stats.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : (it.desc ? `<p class="ic-p">${esc(it.desc)}</p>` : '')}
    ${pas.map(p => `<p class="ic-p">${p.t ? `<b>${esc(p.t)}.</b> ` : ''}${esc(p.d)}</p>`).join('')}
    ${short && pas.length ? '' : ''}`;
}
function openItem(id){
  pop.hidden = true;
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="sheet item-sheet" role="dialog" aria-modal="true" aria-label="${esc(I(id).name)}"><div class="panel-h"><h2>Предмет</h2><button class="x" data-close aria-label="Закрыть">✕</button></div><div class="panel-b">${itemCard(id)}</div></div>`;
  document.body.appendChild(wrap);
  const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-close]')) close(); });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-item]');
  if (!el || el.closest('.item-sheet')) return;
  e.preventDefault(); e.stopPropagation();
  openItem(el.dataset.item);
}, true);

/* ---------- data & live update ---------- */
function ago(iso){
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (m < 1) return 'только что';
  if (m < 60) return m + ' мин назад';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' ч назад';
  return new Date(iso).toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
}
function setData(d){
  S.data = d; S.tierCache = {};
  HM = Object.fromEntries(d.heroes.map(h => [h.id, h]));
  if (!H(S.me)) S.me = d.heroes[0].id;
  if (!H(S.en) || S.en === S.me) S.en = d.heroes.find(h => h.id !== S.me).id;
  $('#live').innerHTML = `<i></i><span class="lbl">${esc(d.patch)}</span>`;
  $('#live').title = `Версия данных ${d.version}. Страница проверяет обновления каждые 5 минут.`;
}
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 4000); }
async function getJSON(u){ const r = await fetch(u + '?t=' + Date.now(), { cache:'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
async function boot(){
  const imgP = getJSON('img.json').catch(() => ({}));
  try { setData(await getJSON('data.json')); }
  catch(e){
    $('#app').innerHTML = `<main><div class="wrap"><div class="loading">Не удалось загрузить статистику. Обнови страницу через минуту.</div></div></main>`;
    $('#live').innerHTML = '<span class="lbl">нет связи</span>';
    return;
  }
  render();
  S.img = await imgP; render(true);
  setInterval(async () => {
    try{
      const d = await getJSON('data.json');
      if (d.version !== S.data.version){
        setData(d); S.img = await getJSON('img.json').catch(() => S.img);
        render(true); toast(`Статистика обновлена: ${d.patch}`);
      }
    }catch(e){}
    const a = document.getElementById('ago'); if (a) a.textContent = ago(S.data.updated);
  }, POLL_MS);
}
boot();
})();
</script>
